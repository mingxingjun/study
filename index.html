    <script>
      // Map.prototype.getOrInsertComputed polyfill
      // pdfjs-dist v6 内部依赖此 ES2025 方法，较旧浏览器不支持，会导致文档解析失败
      // 必须在所有 ES module 之前执行，因此内联在 head 中
      if (typeof Map.prototype.getOrInsertComputed !== 'function') {
        Map.prototype.getOrInsertComputed = function (key, callbackFn) {
          if (this.has(key)) {
            return this.get(key);
          }
          const value = callbackFn.call(this, key);
          this.set(key, value);
          return value;
        };
      }
    </script>
